<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learning Astro on the 大灣區房投 website</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+HK:wght@400;500;700&family=Noto+Serif+HK:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#ffffff; --surface:#ffffff; --surface-2:#f2f5f3;
  --ink:#1c2620; --ink-2:#4a5a50; --ink-3:#6c7b72;
  --accent:#395143; --accent-strong:#26382e;
  --btn:#395143; --btn-hover:#26382e; --btn-ink:#ffffff; --btn-2:#ffffff;
  --gold:#efb43f; --gold-ink:#8a6110; --gold-wash:rgb(239 180 63 / .15); --gold-line:rgb(239 180 63 / .5);
  --rule:#dce3de; --rule-strong:#c0ccc4;
  --code-bg:#f2f5f3; --code-ink:#1e2a23; --code-dim:#8b988f; --code-hl:rgb(239 180 63 / .2); --code-focus:rgb(239 180 63 / .38);
  --ok:#2a7748; --ok-wash:#e3f1e8; --bad:#ad3f2a; --bad-wash:#f8e5e0; --part:#80590d; --part-wash:#fbefd6;
  --side-bg:#26382e; --side-ink:#eef3ef; --side-dim:#a9b9ae; --side-hover:rgb(255 255 255 / .07); --side-active:rgb(239 180 63 / .17);
  --zone-fence:#395143; --zone-template:#9db3a5; --zone-style:#efb43f;
  --term-bg:#17211b; --term-ink:#dbe5de; --term-dim:#8fa197; --term-ok:#8fd3a8; --term-bad:#f19a85;
  --radius:6px;
  --font-sans:'Noto Sans HK','PingFang HK','Microsoft JhengHei',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-serif:'Noto Serif HK','Songti TC','PMingLiU',Georgia,'Times New Roman',serif;
  --font-mono:'IBM Plex Mono','Noto Sans HK',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#121a15; --surface:#18211b; --surface-2:#1d2822;
    --ink:#e3eae5; --ink-2:#b0bdb4; --ink-3:#8c9a90;
    --accent:#9cc3a9; --accent-strong:#c2dccb;
    --btn:#4b705c; --btn-hover:#5a836c; --btn-ink:#ffffff; --btn-2:#18211b;
    --gold-ink:#f0c35f; --gold-wash:rgb(239 180 63 / .12); --gold-line:rgb(239 180 63 / .45);
    --rule:#2a362e; --rule-strong:#3b4a40;
    --code-bg:#19231d; --code-ink:#dde6e0; --code-dim:#6e7f74; --code-hl:rgb(239 180 63 / .14); --code-focus:rgb(239 180 63 / .3);
    --ok:#78d29e; --ok-wash:rgb(120 210 158 / .12); --bad:#f2927b; --bad-wash:rgb(242 146 123 / .12); --part:#f0c35f; --part-wash:rgb(240 195 95 / .12);
    --side-bg:#0d1410; --side-ink:#e6ede8; --side-dim:#91a297;
    --zone-fence:#7fa98e; --zone-template:#4f6658; --zone-style:#efb43f;
  }
}
:root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#121a15; --surface:#18211b; --surface-2:#1d2822;
    --ink:#e3eae5; --ink-2:#b0bdb4; --ink-3:#8c9a90;
    --accent:#9cc3a9; --accent-strong:#c2dccb;
    --btn:#4b705c; --btn-hover:#5a836c; --btn-ink:#ffffff; --btn-2:#18211b;
    --gold-ink:#f0c35f; --gold-wash:rgb(239 180 63 / .12); --gold-line:rgb(239 180 63 / .45);
    --rule:#2a362e; --rule-strong:#3b4a40;
    --code-bg:#19231d; --code-ink:#dde6e0; --code-dim:#6e7f74; --code-hl:rgb(239 180 63 / .14); --code-focus:rgb(239 180 63 / .3);
    --ok:#78d29e; --ok-wash:rgb(120 210 158 / .12); --bad:#f2927b; --bad-wash:rgb(242 146 123 / .12); --part:#f0c35f; --part-wash:rgb(240 195 95 / .12);
    --side-bg:#0d1410; --side-ink:#e6ede8; --side-dim:#91a297;
    --zone-fence:#7fa98e; --zone-template:#4f6658; --zone-style:#efb43f;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:16px;line-height:1.65}
img,svg{max-width:100%}
a{color:var(--accent)}
code{font-family:var(--font-mono);font-size:.88em;background:var(--surface-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .3em;white-space:nowrap}
pre code{white-space:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.visually-hidden{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:292px minmax(0,1fr);min-height:100%}
.topbar{display:none}
.sidebar{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto;background:var(--side-bg);color:var(--side-ink);padding:28px 18px 24px;display:flex;flex-direction:column;gap:22px}
.brand{padding:0 10px}
.brand-rule{display:block;width:36px;height:3px;background:var(--gold);margin-bottom:14px}
.brand h2{font-family:var(--font-serif);font-size:1.3rem;line-height:1.3;margin:0;font-weight:700}
.brand p{margin:.25rem 0 0;color:var(--side-dim);font-size:.86rem}
.progress{padding:0 10px}
.progress-bar{height:6px;background:rgb(255 255 255 / .1);border-radius:3px;overflow:hidden}
.progress-bar span{display:block;height:100%;background:var(--gold);width:0;transition:width .4s ease}
.progress p{margin:.5rem 0 0;font-size:.82rem;color:var(--side-dim)}
.nav-group h3{font-size:.78rem;font-weight:500;color:var(--side-dim);margin:0 0 6px;padding:0 10px;letter-spacing:.01em}
.nav-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:var(--side-ink);padding:7px 10px;border-radius:5px;cursor:pointer;font-size:.92rem;line-height:1.35}
.nav-item:hover{background:var(--side-hover)}
.nav-item[aria-current="page"]{background:var(--side-active)}
.nav-item .n{flex:0 0 22px;height:22px;border-radius:50%;border:1.5px solid rgb(255 255 255 / .28);display:grid;place-items:center;font-size:.72rem;color:var(--side-dim)}
.nav-item.is-started .n{border-color:var(--gold);color:var(--gold)}
.nav-item.is-done .n{background:var(--gold);border-color:var(--gold);color:#26382e;font-weight:700}
.nav-item .ic{flex:0 0 22px;display:grid;place-items:center;color:var(--gold)}
.side-foot{margin-top:auto;padding:0 10px;font-size:.8rem;color:var(--side-dim);display:flex;flex-direction:column;gap:8px}
.save-status::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-right:7px;vertical-align:1px}
.reset-btn{align-self:flex-start;background:none;border:1px solid rgb(255 255 255 / .2);color:var(--side-dim);border-radius:4px;padding:3px 9px;font-size:.78rem;cursor:pointer}
.reset-btn.is-armed{border-color:var(--gold);color:var(--gold)}

.main{padding:44px 56px 96px;min-width:0}
.content{max-width:740px}
.content.is-wide{max-width:1160px}

@media (max-width: 899px){
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--side-bg)}
  .app{grid-template-columns:minmax(0,1fr)}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;align-items:center;justify-content:space-between;gap:12px;background:var(--side-bg);color:var(--side-ink);padding:10px 16px}
  .topbar strong{font-family:var(--font-serif);font-size:1rem}
  .topbar button{background:none;border:1px solid rgb(255 255 255 / .25);color:inherit;border-radius:5px;padding:5px 12px;cursor:pointer}
  .sidebar{position:fixed;z-index:30;top:0;left:0;bottom:0;height:auto;width:min(320px,88vw);padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-102%);transition:transform .25s ease;box-shadow:0 0 0 100vmax transparent}
  .sidebar.is-open{transform:none;box-shadow:0 0 0 100vmax rgb(0 0 0 / .45)}
  .sidebar{border-right:1px solid rgb(255 255 255 / .08)}
  .main{padding:26px 18px 80px}
}
@media (max-width: 600px){ code{white-space:normal;overflow-wrap:anywhere} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }

/* ---------- type ---------- */
h1,.h1{font-family:var(--font-serif);font-weight:700;font-size:2.05rem;line-height:1.25;margin:.2rem 0 .6rem;color:var(--ink)}
h2{font-family:var(--font-serif);font-weight:700;font-size:1.35rem;line-height:1.35;margin:2rem 0 .6rem}
h3{font-size:1.05rem;line-height:1.4;margin:1.4rem 0 .4rem}
h4{font-size:.98rem;margin:0 0 .25rem}
p{margin:.65rem 0}
.kicker{color:var(--gold-ink);font-size:.9rem;font-weight:500;margin:0}
.lede{font-size:1.08rem;color:var(--ink-2);max-width:62ch}
.muted{color:var(--ink-3)}
.small{font-size:.88rem}
.tip{border-left:3px solid var(--gold);background:var(--gold-wash);padding:.7rem 1rem;border-radius:0 var(--radius) var(--radius) 0;font-size:.95rem}
.model-note{display:flex;gap:10px;align-items:flex-start;border:1px dashed var(--rule-strong);border-radius:var(--radius);padding:.6rem .9rem;font-size:.88rem;color:var(--ink-2);margin:.8rem 0}
.model-note strong{color:var(--ink)}
ol.parts,ul.plain{padding-left:1.25rem}
ol.parts li,ul.plain li{margin:.45rem 0}
table.simple{border-collapse:collapse;width:100%;font-size:.93rem;margin:.8rem 0}
table.simple th,table.simple td{text-align:left;vertical-align:top;padding:.5rem .7rem;border-bottom:1px solid var(--rule)}
table.simple th{font-weight:500;color:var(--ink-2);font-size:.85rem}
.table-scroll{overflow-x:auto}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--btn);background:var(--btn);color:var(--btn-ink);border-radius:5px;padding:.5rem 1rem;cursor:pointer;font-weight:500;font-size:.95rem;line-height:1.3;text-decoration:none}
.btn:hover{background:var(--btn-hover);border-color:var(--btn-hover)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.secondary{background:var(--btn-2);color:var(--accent);border-color:var(--rule-strong)}
.btn.secondary:hover{border-color:var(--accent)}
.btn.small{padding:.3rem .7rem;font-size:.85rem}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:1rem 0}
.linklike{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font:inherit}

/* ---------- home ---------- */
.pipeline{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin:1.6rem 0 .6rem;position:relative}
.pipe-stage{position:relative;padding:14px 14px 14px 16px;border-top:3px solid var(--accent);background:var(--surface-2);min-height:112px}
.pipe-stage + .pipe-stage{border-left:1px solid var(--bg)}
.pipe-stage h4{font-family:var(--font-mono);font-size:.86rem;font-weight:500;margin:0 0 .3rem;color:var(--accent)}
.pipe-stage p{margin:0;font-size:.86rem;color:var(--ink-2);line-height:1.5}
.pipe-stage .act{display:block;margin-top:.45rem;font-family:var(--font-mono);font-size:.76rem;color:var(--gold-ink)}
.pipe-stage.is-gold{border-top-color:var(--gold)}
.pipe-aside{margin:.3rem 0 1.6rem;border:1.5px dashed var(--rule-strong);border-radius:var(--radius);padding:.6rem .9rem;font-size:.88rem;color:var(--ink-2);max-width:560px}
.pipe-aside code{white-space:normal}
@media (max-width: 720px){ .pipeline{grid-template-columns:1fr 1fr} .pipe-stage{min-height:0} }
.questions{list-style:none;padding:0;margin:1rem 0;display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.questions li{border-bottom:1px solid var(--rule);padding:.85rem 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:start}
.questions .q{font-weight:500;margin:0}
.questions .a{grid-column:1;margin:0;color:var(--ink-2);font-size:.93rem}
.questions .go{grid-row:1 / span 2;grid-column:2;align-self:center}
@media (max-width: 560px){ .questions li{grid-template-columns:minmax(0,1fr)} .questions .go{grid-row:auto;grid-column:1;justify-self:start} }
.tool-links{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin:1rem 0}
.tool-link{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--rule);border-left:3px solid var(--gold);background:var(--surface);padding:.75rem .9rem;border-radius:0 var(--radius) var(--radius) 0;cursor:pointer}
.tool-link:hover{border-color:var(--rule-strong);border-left-color:var(--gold)}
.tool-link strong{display:block;color:var(--accent)}
.tool-link span{font-size:.86rem;color:var(--ink-2)}

/* ---------- lesson ---------- */
.lesson-head{border-bottom:1px solid var(--rule);padding-bottom:1rem;margin-bottom:1.4rem}
.goal{color:var(--ink-2);margin:.1rem 0 1rem}
.stepper{display:flex;flex-wrap:wrap;gap:6px}
.step-pill{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--rule);border-radius:999px;padding:4px 12px 4px 5px;cursor:pointer;font-size:.88rem;color:var(--ink-2)}
.step-pill .num{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-size:.75rem;font-weight:500}
.step-pill[aria-current="step"]{border-color:var(--accent);color:var(--ink);font-weight:500}
.step-pill[aria-current="step"] .num{background:var(--accent);color:var(--bg)}
.step-pill.is-seen .num{background:var(--gold-wash);color:var(--gold-ink)}
.step-pill[aria-current="step"].is-seen .num{background:var(--accent);color:var(--bg)}
.step-body{min-height:260px}
.step-nav{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--rule);margin-top:2rem;padding-top:1.1rem;flex-wrap:wrap}
.done-flag{display:inline-flex;align-items:center;gap:6px;color:var(--ok);font-weight:500;font-size:.9rem}
.ex-badge{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--ok);background:var(--ok-wash);border-radius:999px;padding:2px 10px;margin:.2rem 0 .6rem}

.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:1rem 0}
.trio-item{border:1px solid var(--rule);border-top:3px solid var(--accent);border-radius:0 0 var(--radius) var(--radius);padding:.75rem .9rem;background:var(--surface)}
.trio-item.is-mockup{border-style:dashed;border-top:3px dashed var(--rule-strong)}
.trio-item.is-built{border-top-color:var(--gold)}
.trio-item .path{font-family:var(--font-mono);font-size:.78rem;color:var(--gold-ink);margin:0 0 .4rem;word-break:break-all}
.trio-item p{font-size:.9rem;margin:.35rem 0}
.trio-item .tag{display:inline-block;font-size:.76rem;border-radius:999px;padding:1px 8px;background:var(--surface-2);color:var(--ink-2)}
@media (max-width: 720px){ .trio{grid-template-columns:minmax(0,1fr)} }

.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px;margin:1rem 0}
.flow .box{border:1px solid var(--rule);border-radius:var(--radius);padding:.45rem .7rem;font-size:.86rem;background:var(--surface);flex:1 1 120px}
.flow .box b{display:block;font-family:var(--font-mono);font-weight:500;font-size:.8rem;color:var(--accent)}
.flow .arr{align-self:center;color:var(--gold-ink);font-family:var(--font-mono);font-size:.8rem;text-align:center;flex:0 0 auto}
.flow-label{font-size:.82rem;color:var(--ink-3);margin:.8rem 0 -.4rem}

.mapline{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:1rem 0;font-size:.86rem}
.mapline .tok{border:1px solid var(--rule);border-radius:5px;padding:.3rem .55rem;background:var(--surface);font-family:var(--font-mono);font-size:.8rem}
.mapline .tok.out{border-color:var(--gold);background:var(--gold-wash)}
.mapline .arr{color:var(--gold-ink);font-family:var(--font-mono);font-size:.78rem}

/* ---------- code ---------- */
.code{margin:1.1rem 0;border:1px solid var(--rule);border-radius:var(--radius);background:var(--code-bg);overflow:hidden}
.code-head{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.45rem .9rem;border-bottom:1px solid var(--rule);font-family:var(--font-mono);font-size:.78rem;color:var(--ink-2)}
.code-head .lab{font-family:var(--font-sans);font-size:.78rem;color:var(--ink-3)}
.code-scroll{overflow-x:auto}
.code-lines{display:table;min-width:100%;font-family:var(--font-mono);font-size:.83rem;line-height:1.62;padding:.55rem 0;margin:0;color:var(--code-ink)}
.ln{display:table-row}
.ln > span{display:table-cell}
.ln .zn{width:4px;padding:0}
.ln .no{color:var(--code-dim);text-align:right;padding:0 .8rem 0 .7rem;width:1%;user-select:none;-webkit-user-select:none;white-space:nowrap}
.ln .tx{white-space:pre;padding-right:1.2rem}
.ln.hl{background:var(--code-hl)}
.ln.hl .no{color:var(--gold-ink);font-weight:500}
.ln.is-focus{background:var(--code-focus)}
.ln.dim .tx{opacity:.55}
.ln.z-fence .zn{background:var(--zone-fence)}
.ln.z-template .zn{background:var(--zone-template)}
.ln.z-style .zn{background:var(--zone-style)}
.ln.changed{animation:flash 1.3s ease}
@keyframes flash{0%{background:var(--code-focus)}100%{background:transparent}}
.notes{list-style:none;margin:0;padding:.3rem 0;border-top:1px solid var(--rule);background:var(--surface)}
.notes li{display:grid;grid-template-columns:4.6rem minmax(0,1fr);gap:10px;padding:.42rem .9rem;font-size:.9rem;cursor:default}
.notes li:hover,.notes li:focus-within,.notes li:focus{background:var(--gold-wash);outline:none}
.notes .lno{font-family:var(--font-mono);font-size:.76rem;color:var(--gold-ink);padding-top:.15rem;white-space:nowrap}
.zone-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.82rem;color:var(--ink-2);margin:.6rem 0 -.4rem}
.zone-legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-2px;background:var(--c)}
.snippet-intro{color:var(--ink-2);font-size:.95rem}
.inline-code{font-family:var(--font-mono);font-size:.86rem;background:var(--code-bg);border:1px solid var(--rule);border-radius:var(--radius);padding:.65rem .9rem;overflow-x:auto;white-space:pre;margin:.8rem 0}

/* ---------- quiz ---------- */
.quiz{display:flex;flex-direction:column;gap:1.6rem}
.q-block .q-text{font-weight:500;margin:0 0 .6rem}
.q-block .q-text .qn{color:var(--gold-ink);margin-right:.35rem}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1px solid var(--rule-strong);border-radius:var(--radius);padding:.55rem .8rem;cursor:pointer;line-height:1.5}
.opt:hover{border-color:var(--accent)}
.opt .key{flex:0 0 1.5rem;height:1.5rem;border-radius:50%;border:1px solid var(--rule-strong);display:grid;place-items:center;font-size:.75rem;color:var(--ink-3)}
.opt.is-picked.is-right{border-color:var(--ok);background:var(--ok-wash)}
.opt.is-picked.is-wrong{border-color:var(--bad);background:var(--bad-wash)}
.opt.is-right-answer:not(.is-picked){border-color:var(--ok)}
.opt.is-picked .key{border-color:currentColor}
.opt.is-picked.is-right .key{background:var(--ok);color:var(--bg);border-color:var(--ok)}
.opt.is-picked.is-wrong .key{background:var(--bad);color:var(--bg);border-color:var(--bad)}
.explain{margin-top:.7rem;border-left:3px solid var(--rule-strong);padding:.2rem 0 .2rem .9rem;font-size:.92rem}
.explain .verdict{font-weight:700;margin:0 0 .35rem}
.explain .verdict.ok{color:var(--ok)}
.explain .verdict.bad{color:var(--bad)}
.explain ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:.35rem}
.explain li{color:var(--ink-2)}
.explain li b{color:var(--ink);font-weight:500}
.explain li .tag{font-size:.78rem;font-weight:700;margin-right:.35rem}
.explain li .tag.ok{color:var(--ok)}
.explain li .tag.bad{color:var(--bad)}
.quiz-foot{font-size:.9rem;color:var(--ink-2)}

/* ---------- widgets: shared ---------- */
.widget{border:1px solid var(--rule);border-radius:var(--radius);padding:1rem 1.1rem;background:var(--surface);margin:1rem 0}
.widget h4{margin:0 0 .4rem}
.w-status{font-size:.9rem;margin:.6rem 0 0;min-height:1.4em}
.w-status.ok{color:var(--ok);font-weight:500}
.w-status.bad{color:var(--bad)}
.w-status.part{color:var(--part)}
.field{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--ink-2)}
.field input[type="text"],.field textarea,.field select,.inp{border:1px solid var(--rule-strong);background:var(--bg);border-radius:5px;padding:.4rem .55rem;color:var(--ink);font-size:.93rem;width:100%}
.field textarea{resize:vertical;min-height:4.2em;line-height:1.5}
.inp:focus,.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule-strong);background:var(--surface);border-radius:999px;padding:3px 12px;cursor:pointer;font-size:.86rem}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}

/* calc */
.calc{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px 26px;align-items:start}
.calc .sliders{display:flex;flex-direction:column;gap:12px}
.calc label{display:flex;flex-direction:column;font-size:.88rem;color:var(--ink-2)}
.calc label .row{display:flex;justify-content:space-between}
.calc label output{font-weight:700;color:var(--ink);font-family:var(--font-mono)}
.calc input[type="range"]{accent-color:var(--accent);width:100%}
.calc-out{border-left:3px solid var(--bad);padding:.2rem 0 .2rem .9rem}
.calc-out.astro{border-left-color:var(--ok);margin-top:1rem}
.calc-num{font-family:var(--font-serif);font-size:2.6rem;line-height:1.1;font-weight:700}
.calc-out p{margin:.2rem 0;font-size:.9rem;color:var(--ink-2)}
.calc-out .formula{font-family:var(--font-mono);font-size:.78rem;color:var(--ink-3)}
@media (max-width: 640px){ .calc{grid-template-columns:minmax(0,1fr)} }

/* order */
.order-pool{display:flex;flex-wrap:wrap;gap:8px;margin:.6rem 0}
.order-card{border:1px solid var(--rule-strong);background:var(--surface);border-radius:var(--radius);padding:.5rem .75rem;cursor:pointer;text-align:left;font-size:.9rem;max-width:280px}
.order-card:hover{border-color:var(--accent)}
.order-card.is-used{opacity:.35;cursor:default}
.order-card.is-shake{animation:shake .35s}
.order-card.is-decoy-found{border-style:dashed;opacity:.6}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.order-track{list-style:none;padding:0;margin:.8rem 0;display:flex;flex-direction:column;gap:6px;counter-reset:step}
.order-track li{counter-increment:step;display:flex;gap:10px;align-items:center;font-size:.9rem;border-bottom:1px dashed var(--rule);padding:.3rem 0;min-height:2.2rem;color:var(--ink-3)}
.order-track li::before{content:counter(step);flex:0 0 1.6rem;height:1.6rem;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:.78rem;font-weight:500;color:var(--ink-2)}
.order-track li.is-filled{color:var(--ink)}
.order-track li.is-filled::before{background:var(--gold);color:#26382e}

/* terminal */
.term-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width: 860px){ .term-wrap{grid-template-columns:minmax(0,1fr)} }
.term{background:var(--term-bg);color:var(--term-ink);border-radius:var(--radius);font-family:var(--font-mono);font-size:.78rem;line-height:1.55;padding:.8rem .9rem;min-height:250px;max-height:340px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.term .cmd{color:#ffffff}
.term .dim{color:var(--term-dim)}
.term .ok{color:var(--term-ok)}
.term .bad{color:var(--term-bad)}
.browser{border:1px solid var(--rule-strong);border-radius:var(--radius);overflow:hidden;background:#fff;color:#1c2620;min-height:250px;display:flex;flex-direction:column}
.browser-bar{background:#e9eeea;padding:.35rem .6rem;font-family:var(--font-mono);font-size:.74rem;color:#4a5a50;border-bottom:1px solid #d3dbd5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.browser-body{flex:1;padding:.8rem;font-size:.85rem;overflow:auto}
.browser-empty{color:#6c7b72;display:grid;place-items:center;height:100%;text-align:center;min-height:190px}
.raw{font-family:var(--font-mono);font-size:.72rem;white-space:pre;color:#333;background:#fff}
.goal-list{list-style:none;padding:0;margin:.6rem 0 0;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.88rem}
.goal-list li::before{content:"○";margin-right:6px;color:var(--ink-3)}
.goal-list li.is-met{color:var(--ok)}
.goal-list li.is-met::before{content:"●";color:var(--ok)}
.cmd-row{display:flex;flex-wrap:wrap;gap:6px;margin:.2rem 0 .7rem}
.cmd-btn{font-family:var(--font-mono);font-size:.8rem;border:1px solid var(--rule-strong);background:var(--surface-2);border-radius:5px;padding:.35rem .6rem;cursor:pointer;color:var(--ink)}
.cmd-btn:hover{border-color:var(--accent)}
.cmd-btn.alt{font-family:var(--font-sans);background:var(--surface)}

/* site mock (always light: it depicts the real site) */
.site-mock{--m-forest:#395143;--m-deep:#26382e;--m-gold:#efb43f;--m-line:rgb(239 180 63 / .4);--m-surface:#ffffff;background:var(--m-surface);color:#1c2620;font-family:var(--font-sans);border-radius:4px;overflow:hidden;border:1px solid #d8e0da}
.site-mock .m-head{background:var(--m-deep);color:#fff;padding:.45rem .7rem;display:flex;justify-content:space-between;align-items:center;font-size:.74rem;gap:8px}
.site-mock .m-head b{font-family:var(--font-serif);font-size:.82rem}
.site-mock .m-head .m-nav{display:flex;gap:9px;opacity:.85;flex-wrap:wrap}
.site-mock .m-hero{background:linear-gradient(135deg,var(--m-forest),var(--m-deep));color:#fff;padding:1rem .8rem;font-family:var(--font-serif);font-size:.95rem}
.site-mock .m-hero small{display:block;font-family:var(--font-sans);font-size:.7rem;opacity:.8;margin-top:.2rem}
.site-mock .m-main{padding:.6rem .8rem}
.site-mock .m-foot{background:var(--m-deep);color:#cfd9d2;padding:.45rem .7rem;font-size:.7rem}
.site-mock h5{font-family:var(--font-serif);color:var(--m-forest);margin:.2rem 0 .4rem;font-size:.9rem}
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:4px 18px}
.svc{border-top:1px solid var(--m-line);padding:.6rem 0 .8rem}
.svc h6{display:flex;align-items:center;gap:7px;margin:0 0 .3rem;font-size:.86rem;color:var(--m-deep);font-family:var(--font-serif)}
.svc h6 svg{color:var(--m-gold);flex:0 0 auto}
.svc p{margin:0 0 .4rem;font-size:.76rem;color:#4a5a50;line-height:1.5}
.svc ul{list-style:none;padding:0;margin:0;font-size:.76rem;display:flex;flex-direction:column;gap:2px}
.svc li{display:flex;align-items:center;gap:4px}
.svc li svg{color:var(--m-gold);flex:0 0 auto}
.svc a{color:var(--m-forest)}
.is-mockup-view{border:2px dashed #b9c4bd;padding:.6rem;font-size:.8rem;color:#4a5a50}
.is-mockup-view .stamp{display:inline-block;border:1px solid #b9c4bd;border-radius:3px;padding:0 6px;font-size:.7rem;margin-bottom:.4rem}

/* classify */
.cls-score{font-size:.9rem;color:var(--ink-2);margin:.2rem 0 .8rem}
.cls-list{display:flex;flex-direction:column;gap:10px}
.cls-item{border:1px solid var(--rule);border-left:4px solid var(--rule-strong);border-radius:0 var(--radius) var(--radius) 0;padding:.65rem .85rem;background:var(--surface)}
.cls-item.is-right{border-left-color:var(--ok)}
.cls-item.is-wrong{border-left-color:var(--bad)}
.cls-item .what{display:flex;flex-direction:column;gap:4px}
.cls-item pre{margin:0;font-family:var(--font-mono);font-size:.8rem;background:var(--code-bg);border-radius:4px;padding:.35rem .55rem;overflow-x:auto;white-space:pre}
.cls-item .desc{font-size:.88rem;color:var(--ink-2)}
.cls-bins{display:flex;flex-wrap:wrap;gap:6px;margin-top:.5rem}
.bin-btn{border:1px solid var(--rule-strong);background:var(--surface);border-radius:5px;padding:.28rem .7rem;font-size:.84rem;cursor:pointer}
.bin-btn:hover{border-color:var(--accent)}
.bin-btn[aria-pressed="true"].is-right{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.bin-btn[aria-pressed="true"].is-wrong{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.cls-why{font-size:.88rem;margin:.45rem 0 0}
.cls-why.ok{color:var(--ok)}
.cls-why.bad{color:var(--bad)}
.cls-why span{color:var(--ink-2)}

/* icon props */
.props-play{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:16px;align-items:center}
@media (max-width: 600px){ .props-play{grid-template-columns:minmax(0,1fr)} }
.props-code{font-family:var(--font-mono);font-size:.86rem;background:var(--code-bg);border-radius:var(--radius);padding:.6rem .8rem;line-height:2;overflow-x:auto;white-space:nowrap}
.props-code select{font-family:var(--font-mono);font-size:.82rem;border:1px solid var(--gold);background:var(--gold-wash);border-radius:4px;padding:1px 4px;color:var(--ink)}
.props-out{display:grid;place-items:center;height:150px;border:1px solid var(--rule);border-radius:var(--radius);background:#fff;color:#efb43f}
.props-obj{font-family:var(--font-mono);font-size:.8rem;color:var(--ink-2);margin-top:.6rem}

/* map stepper */
.mapper{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr) minmax(0,1.2fr);gap:12px;align-items:start}
@media (max-width: 860px){ .mapper{grid-template-columns:minmax(0,1fr)} }
.mapper h5{font-size:.82rem;font-weight:500;color:var(--ink-3);margin:0 0 .4rem}
.m-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:5px;font-size:.84rem}
.m-list li{border:1px solid var(--rule);border-radius:5px;padding:.35rem .55rem;font-family:var(--font-mono);font-size:.76rem;background:var(--surface)}
.m-list li.is-now{border-color:var(--gold);background:var(--gold-wash)}
.m-list li.is-past{opacity:.5}
.m-recipe{border:1px solid var(--rule);border-radius:5px;padding:.6rem;font-family:var(--font-mono);font-size:.76rem;background:var(--code-bg);white-space:pre-wrap;word-break:break-word}
.m-recipe .val{color:var(--gold-ink);font-weight:500}
.m-out{display:flex;flex-direction:column;gap:6px;min-height:80px}
.m-out .block{border-top:2px solid var(--gold);background:#fff;color:#1c2620;padding:.4rem .5rem;font-size:.78rem;border-radius:0 0 4px 4px;border-left:1px solid #e1e7e3;border-right:1px solid #e1e7e3;border-bottom:1px solid #e1e7e3}
.m-out .block b{font-family:var(--font-serif);color:#26382e}
.m-out .empty{font-size:.84rem;color:var(--ink-3);border:1px dashed var(--rule-strong);border-radius:5px;padding:.6rem}

/* layout assembler */
.lay{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:16px}
@media (max-width: 760px){ .lay{grid-template-columns:minmax(0,1fr)} }
.lay .controls{display:flex;flex-direction:column;gap:12px}
.slot-box{border:2px dashed #efb43f;margin:.3rem 0;padding:.5rem;border-radius:4px;font-size:.78rem;background:#fffaf0;color:#1c2620}
.slot-box .slot-tag{font-family:var(--font-mono);font-size:.68rem;color:#8a6110;display:block;margin-bottom:.2rem}
.slot-box.is-gone{border-color:#c9d2cc;background:#f6f8f7;color:#8b988f;text-align:center}
.head-line{font-family:var(--font-mono);font-size:.68rem;background:#f2f5f3;color:#4a5a50;padding:.3rem .7rem;border-bottom:1px solid #e1e7e3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.check{display:flex;gap:8px;align-items:flex-start;font-size:.9rem;cursor:pointer;line-height:1.5}
.check input{margin-top:.2rem;flex:0 0 auto}
.check input{accent-color:var(--accent);width:1.05rem;height:1.05rem}

/* router */
.router .path-in{display:flex;align-items:stretch;border:1px solid var(--rule-strong);border-radius:5px;overflow:hidden;font-family:var(--font-mono);font-size:.9rem;max-width:480px}
.router .path-in span{background:var(--surface-2);padding:.45rem .6rem;color:var(--ink-3);border-right:1px solid var(--rule-strong)}
.router .path-in input{border:0;padding:.45rem .6rem;flex:1;min-width:0;background:var(--bg);font-family:var(--font-mono);font-size:.9rem;color:var(--ink)}
.router .path-in input:focus{outline:none}
.router .path-in:focus-within{outline:2px solid var(--gold)}
.route-out{margin:.8rem 0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:.92rem}
.route-out dt{color:var(--ink-3);font-size:.85rem}
.route-out dd{margin:0;font-family:var(--font-mono);font-size:.88rem;word-break:break-all}
.route-out dd.big{font-size:1.05rem;color:var(--accent);font-weight:500}
.route-err{color:var(--bad);font-size:.9rem;margin:.8rem 0}
.challenges{list-style:none;padding:0;margin:.4rem 0 0;display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.challenges li::before{content:"○";margin-right:8px;color:var(--ink-3)}
.challenges li.is-met{color:var(--ok)}
.challenges li.is-met::before{content:"●";color:var(--ok)}

/* tokens */
.tok-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:16px}
@media (max-width: 760px){ .tok-grid{grid-template-columns:minmax(0,1fr)} }
.tok-row{display:flex;align-items:center;gap:10px;font-family:var(--font-mono);font-size:.84rem;padding:.3rem 0;border-bottom:1px solid var(--rule)}
.tok-row input[type="color"]{width:38px;height:28px;border:1px solid var(--rule-strong);border-radius:4px;padding:1px;background:var(--surface);cursor:pointer}
.tok-row .nm{flex:1}
.tok-row .val{color:var(--ink-3);font-size:.78rem}

/* article factory */
.af{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:16px}
@media (max-width: 760px){ .af{grid-template-columns:minmax(0,1fr)} }
.af-files{list-style:none;padding:0;margin:.4rem 0;display:flex;flex-direction:column;gap:4px;font-family:var(--font-mono);font-size:.78rem}
.af-files li{display:flex;justify-content:space-between;gap:8px;border:1px solid var(--rule);border-radius:4px;padding:.25rem .5rem;background:var(--surface)}
.af-pages{display:flex;flex-direction:column;gap:8px}
.af-page{background:#fff;color:#1c2620;border:1px solid #d8e0da;border-radius:4px;overflow:hidden}
.af-page .bar{font-family:var(--font-mono);font-size:.68rem;background:#f2f5f3;color:#4a5a50;padding:.25rem .6rem;border-bottom:1px solid #e1e7e3;word-break:break-all}
.af-page .inner{padding:.55rem .7rem;border-left:4px solid var(--art-accent,#efb43f)}
.af-page .cat{font-size:.7rem;color:#8a6110;margin:0}
.af-page .ttl{font-family:var(--font-serif);font-size:.95rem;color:#26382e;margin:.1rem 0 0;line-height:1.35}
.af-page.is-new{animation:flash 1.3s ease}

/* simulator */
.sim{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:22px;align-items:start}
@media (max-width: 1060px){ .sim{grid-template-columns:minmax(0,1fr)} }
.sim-form{display:flex;flex-direction:column;gap:12px}
.svc-edit{border:1px solid var(--rule);border-radius:var(--radius);background:var(--surface)}
.svc-edit > summary{list-style:none;cursor:pointer;padding:.6rem .85rem;display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:500}
.svc-edit > summary::-webkit-details-marker{display:none}
.svc-edit > summary .sub{font-weight:400;color:var(--ink-3);font-size:.85rem}
.svc-edit > summary::after{content:"+";color:var(--ink-3);font-weight:400}
.svc-edit[open] > summary::after{content:"–"}
.svc-edit .body{padding:.2rem .85rem .9rem;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--rule)}
.item-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr) auto;gap:6px;align-items:center}
.item-row.is-cut input{border-style:dashed;opacity:.65}
.item-row .x{border:1px solid var(--rule-strong);background:var(--surface);border-radius:4px;width:30px;height:30px;cursor:pointer;color:var(--ink-3)}
.item-row .x:hover{color:var(--bad);border-color:var(--bad)}
.cut-note{grid-column:1 / -1;font-size:.78rem;color:var(--part);margin-top:-2px}
.items-head{display:flex;justify-content:space-between;align-items:baseline;font-size:.86rem;color:var(--ink-2)}
.sim-out{position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}
@media (max-width: 1060px){ .sim-out{position:static} }
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin-bottom:-1px}
.tab{border:1px solid transparent;border-bottom:0;background:none;padding:.45rem .9rem;cursor:pointer;border-radius:5px 5px 0 0;color:var(--ink-2);font-size:.9rem}
.tab[aria-selected="true"]{border-color:var(--rule);background:var(--code-bg);color:var(--ink);font-weight:500}
.tabpanel{border:1px solid var(--rule);border-radius:0 var(--radius) var(--radius) var(--radius);background:var(--code-bg);max-height:68vh;overflow:auto}
.tabpanel .code{margin:0;border:0;border-radius:0}
.tabpanel .pv{padding:.8rem;background:var(--code-bg)}
.sim-summary{font-size:.9rem;color:var(--ink-2);margin:.7rem 0 0}
.warn-list{list-style:none;padding:0;margin:.5rem 0 0;display:flex;flex-direction:column;gap:4px;font-size:.86rem;color:var(--part)}
.src-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--ink-3);padding:.45rem .9rem;border-bottom:1px solid var(--rule);background:var(--surface)}
.src-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* project map */
.pmap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width: 900px){ .pmap{grid-template-columns:minmax(0,1fr)} }
.tree{list-style:none;padding:0;margin:0;font-family:var(--font-mono);font-size:.84rem;border:1px solid var(--rule);border-radius:var(--radius);background:var(--surface);padding:.4rem 0}
.tree li{margin:0}
.tree-btn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;padding:.3rem .8rem;cursor:pointer;font-family:var(--font-mono);font-size:.84rem;color:var(--ink)}
.tree-btn:hover{background:var(--surface-2)}
.tree-btn[aria-pressed="true"]{background:var(--gold-wash);box-shadow:inset 3px 0 0 var(--gold)}
.tree-btn .indent{display:inline-block}
.tree-btn .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-btn.is-folder .nm{font-weight:500}
.tree-btn.is-faded{opacity:.35}
.freq{font-family:var(--font-sans);font-size:.72rem;border-radius:999px;padding:1px 8px;white-space:nowrap}
.freq.often{background:var(--ok-wash);color:var(--ok)}
.freq.rarely{background:var(--part-wash);color:var(--part)}
.freq.never{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--rule)}
.detail{border:1px solid var(--rule);border-top:3px solid var(--gold);border-radius:0 0 var(--radius) var(--radius);padding:1rem 1.1rem;background:var(--surface);position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}
@media (max-width: 900px){ .detail{position:static} }
.detail h3{font-family:var(--font-mono);font-size:1rem;margin:0 0 .4rem;word-break:break-all}
.detail dl{margin:.6rem 0 0;display:flex;flex-direction:column;gap:.7rem}
.detail dt{font-size:.8rem;color:var(--ink-3)}
.detail dd{margin:.1rem 0 0;font-size:.94rem}

/* which file */
.wf{display:grid;grid-template-columns:220px minmax(0,1fr);gap:22px;align-items:start}
@media (max-width: 860px){ .wf{grid-template-columns:minmax(0,1fr)} }
.scen-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:2px}
.scen-btn{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-radius:5px;padding:.4rem .6rem;cursor:pointer;font-size:.88rem;color:var(--ink-2);line-height:1.4}
.scen-btn:hover{background:var(--surface-2)}
.scen-btn[aria-current="true"]{background:var(--gold-wash);color:var(--ink)}
.scen-btn .mk{flex:0 0 1rem;color:var(--ink-3)}
.scen-btn.is-solved .mk{color:var(--ok)}
@media (max-width: 860px){ .scen-list{flex-direction:row;flex-wrap:wrap;gap:4px} .scen-btn{width:auto;border:1px solid var(--rule)} .scen-btn .txt{display:none} }
.scen-card h2{margin-top:.2rem}

  goal: 'What npm install, npm run dev, build and preview each do, and why Live Server showed something different.',
  steps: [
    { label: 'Idea', type: 'read', html: `
<p><strong>npm</strong> is the tool that downloads and runs JavaScript tools. It comes with Node.js.</p>
<p><code>package.json</code> is the project’s recipe card. It lists the tools the project depends on (Astro itself is one of them) and a few named shortcuts called <em>scripts</em>.</p>
<p><code>npm install</code> reads that list and downloads every tool into <code>node_modules/</code>. That folder is large, generated, never edited and never uploaded. Until it exists, commands like <code>astro dev</code> have nothing to run. So on a new computer, or after someone changes <code>package.json</code>, run <code>npm install</code> first.</p>
<p><code>npm run</code> followed by a name runs one of the scripts:</p>
<div class="table-scroll"><table class="simple">
<tr><th>Command</th><th>What it does</th></tr>
<tr><td><code>npm run dev</code></td><td>Trims the fonts, then starts the dev server (usually at <code>http://localhost:4321</code>). Pages are built from source when you load them, and the browser refreshes when you save. For working, not for visitors.</td></tr>
<tr><td><code>npm run build</code></td><td>Trims the fonts, then writes the finished site into <code>dist/</code>. This is what gets uploaded.</td></tr>
<tr><td><code>npm run preview</code></td><td>Serves the <code>dist/</code> that already exists so you can check it before uploading. It doesn’t rebuild.</td></tr>
</table></div>` },
    { label: 'Live Server vs dev', type: 'read', html: `
<p>This is why <code>Main.dc.html</code> in Live Server looked different from <code>npm run dev</code>.</p>
<p><strong>A static file server</strong> (Live Server, and OSS itself) sends files exactly as they are on disk. Point it at <code>Main.dc.html</code> and you see the mockup, because that’s what that file is. Point it at <code>index.astro</code> and the browser receives code it can’t understand. Browsers only understand HTML, CSS and JavaScript.</p>
<p class="flow-label">Static file server</p>
<div class="flow"><div class="box"><b>a file on disk</b>sent unchanged</div><div class="arr">as-is</div><div class="box"><b>browser</b>shows that file</div></div>
<p><strong>The dev server</strong> works differently. When your browser asks for <code>/</code>, Astro finds <code>src/pages/index.astro</code>, runs it, pulls in the layout, components and data, and sends back fresh HTML. Save a file and it does it again.</p>
<p class="flow-label">Dev server (npm run dev)</p>
<div class="flow"><div class="box"><b>src/pages/index.astro</b>+ layout, components, data</div><div class="arr">Astro assembles</div><div class="box"><b>HTML</b>made on request</div><div class="arr">sent</div><div class="box"><b>browser</b>the real page</div></div>
<p><strong><code>npm run build</code></strong> does that same assembly once for every page and saves the results in <code>dist/</code>. OSS then acts as a static file server for those finished files.</p>
<p class="tip">To look at the built site, use <code>npm run preview</code> rather than opening <code>dist/index.html</code> directly. Addresses that start with <code>/</code> (like <code>/images/…</code>) point to the wrong place when a file is opened on its own.</p>` },

{
  id: 'l4', title: 'Components and props',
  goal: 'How a page hands data to a reusable piece.',
  steps: [
    { label: 'Idea', type: 'read', html: `
<p>A <strong>component</strong> is a reusable piece of page, kept in its own <code>.astro</code> file in <code>src/components/</code>. You use it like an HTML tag starting with a capital letter: <code>&lt;ServiceBlock /&gt;</code>. The <code>/&gt;</code> closes the tag because nothing goes inside it.</p>
<p><strong>Props</strong> are the information you hand a component, written like HTML attributes. In <code>&lt;ServiceBlock service={service} /&gt;</code>:</p>
<ul class="plain"><li>the word before <code>=</code> is the prop’s <em>name</em>, the label the component will look for;</li><li>the braces after <code>=</code> hold the <em>value</em>, here one service’s data.</li></ul>
<p>Inside the component, <code>Astro.props</code> holds everything it was handed. <code>const { service } = Astro.props;</code> reads “from the props, take the one called <code>service</code> and keep it under that name”. The <code>interface Props</code> block above it is the component’s list of what it expects to receive.</p>
<p>Think of a form letter: the component is the letter, and the props are the blanks you fill in each time you send it.</p>
<p class="tip">Quotes or braces? Quotes hold plain text: <code>class="service-icon"</code>. Braces hold anything else, such as a number or a value looked up by name: <code>size={30}</code>, <code>name={service.icon}</code>.</p>` },
    { label: 'Code', type: 'code', intro: 'The sending side (<code>index.astro</code>) and the receiving side (<code>ServiceBlock.astro</code>).', snippets: [

      { file: 'src/components/ServiceBlock.astro', src: 'block', lines: [1, 18], hl: {
        6: 'The list of props this component expects: one, called <code>service</code>, shaped like a <code>Service</code> (Lesson 6).',

    { label: 'Check', type: 'quiz', qs: [
      { q: 'In <code>&lt;ServiceBlock service={service} /&gt;</code>, what is the part before the <code>=</code> sign?', opts: [

      { q: 'Where does <code>ServiceBlock</code> get the service it displays?', opts: [

        { t: 'From the page address.', why: 'The address picks the page (Lesson 8). Components get their data from props.' } ] },

  goal: 'How four services become four blocks. The one piece of JavaScript worth learning well.',
  steps: [
    { label: 'Idea', type: 'read', html: `
<p>The line that confuses most people in <code>index.astro</code>:</p>
<div class="inline-code">{services.map((service) =&gt; &lt;ServiceBlock service={service} /&gt;)}</div>
<p>Read it in three pieces.</p>
<p><strong>A list.</strong> <code>services</code> is a list, which JavaScript calls an <em>array</em>. Arrays are written in square brackets with commas between the items: <code>['商業物業投資', '住宅物業投資']</code>. Your <code>services</code> array holds four services.</p>
<p><strong>A recipe.</strong> <code>(service) =&gt; &lt;ServiceBlock service={service} /&gt;</code> is an <em>arrow function</em>: a small, nameless recipe. Read the arrow as “becomes”: <em>a service becomes a ServiceBlock for that service</em>. The word in the brackets is a name for “the item we’re working on now”, chosen by whoever wrote the code.</p>
<p><strong>Repeat for each.</strong> <code>.map()</code> runs a recipe once for every item in a list and collects the results in the same order. Four services in, four ServiceBlocks out. Astro places them one after another in the HTML.</p>
<div class="mapline"><span class="tok">service 1</span><span class="tok">service 2</span><span class="tok">service 3</span><span class="tok">service 4</span><span class="arr">.map(recipe)</span><span class="tok out">block 1</span><span class="tok out">block 2</span><span class="tok out">block 3</span><span class="tok out">block 4</span></div>
<p>It’s a mail merge: one letter template, one row per recipient, one letter each.</p>` },

<p>A <strong>type</strong> describes a shape. Read <code>type Service = { … }</code> as “every service must have these fields, holding these kinds of things”. Each line is one rule:</p>

<tr><td><code>ServiceItem[]</code></td><td><code>[]</code> means “a list of”: a list of ServiceItems</td></tr>

  id: 'l7', title: 'Layouts and <slot />',
  goal: 'How every page shares one <head>, header and footer.',
  steps: [
    { label: 'Idea', type: 'read', html: `
<p>A <strong>layout</strong> is a component that wraps a whole page. <code>BaseLayout.astro</code> holds what every page shares: the <code>&lt;!doctype&gt;</code>, the <code>&lt;head&gt;</code>, the header, the footer and the animation script.</p>
<p><strong><code>&lt;slot /&gt;</code></strong> marks the hole where each page’s own content goes. In <code>index.astro</code>, everything between <code>&lt;BaseLayout …&gt;</code> and <code>&lt;/BaseLayout&gt;</code> (the hero and the services section) is placed where <code>&lt;slot /&gt;</code> sits, inside <code>&lt;main&gt;</code>.</p>

<p><strong><code>public/</code> is copied into <code>dist/</code> unchanged</strong>, keeping the same names and folders. So <code>public/images/hero.jpg</code> becomes <code>dist/images/hero.jpg</code>, and the page loads it from <code>/images/hero.jpg</code>. The word <code>public</code> never appears in the address.</p>

<p><strong>Browser time</strong>, on each visitor’s device, on every visit. Only code inside <code>&lt;script&gt;</code> tags runs here. In your project that’s <code>motion.ts</code> (the scroll animations) and <code>section-snap.ts</code> (one-section-at-a-time scrolling). Astro bundles them into files in <code>dist/</code> and links them from the page.</p>

  try { const raw = localStorage.getItem(LS_KEY); if (raw) return normalize(JSON.parse(raw)); } catch (e) {}
  return fresh();
})();

const remote = { ref: null, writing: false, again: false, timer: null, retries: 0 };
function setSaveStatus(mode){
  const el = $('#saveStatus');
  if (el) el.textContent = mode === 'account' ? 'Progress is saved to your account' : 'Progress is saved in this browser';
}
function save(){
  state.updatedAt = Date.now();
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
  if (remote.ref) { clearTimeout(remote.timer); remote.timer = setTimeout(remoteFlush, 1200); }
  refreshNav();
}
async function remoteFlush(){
  if (!remote.ref) return;
  if (remote.writing) { remote.again = true; return; }
  remote.writing = true;
  try {
    await remote.ref.set({ json: JSON.stringify(state), updatedAt: state.updatedAt });
    remote.retries = 0;
    setSaveStatus('account');
  } catch (e) {
    const c = e && e.code;
    if ((c === 'unavailable' || c === 'resource_exhausted') && remote.retries < 2) {
      remote.retries++;
      clearTimeout(remote.timer);
      remote.timer = setTimeout(remoteFlush, (c === 'unavailable' ? 2500 : 8000) + Math.random() * 1500);
    } else {
      remote.ref = null;
      setSaveStatus('local');
    }
  }
  remote.writing = false;
  if (remote.again) { remote.again = false; remoteFlush(); }
}
async function initRemote(){
  try {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    const both = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    const db = both[0], user = both[1];
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    const ref = db.doc('data/users/' + uid + '/progress');
    const snap = await ref.get();
    remote.ref = ref;
    if (snap.exists) {
      const d = snap.data() || {};
      let rs = null;
      try { rs = normalize(JSON.parse(d.json)); } catch (e) {}
      if (rs && (rs.updatedAt || 0) > (state.updatedAt || 0)) {
        state = rs;
        try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
        setSaveStatus('account');
        render(currentView);
        return;
      }
    }
    if (state.updatedAt > 0) remoteFlush(); else setSaveStatus('account');
  } catch (e) { /* keep browser-only saving */ }
}

let currentView = 'home';

function buildNav(){

function refreshNav(){
  $$('.nav-item').forEach(b => {

function go(view){

function render(view){

function renderSnippet(sn){
  const all = SNIP[sn.src].split('\n');
  const from = sn.lines ? sn.lines[0] : 1, to = sn.lines ? sn.lines[1] : all.length;
  const zoneOf = n => { if (!sn.zones) return ''; for (const z of sn.zones) { if (n >= z[0] && n <= z[1]) return ' z-' + z[2]; } return ''; };
  let rows = '';
  for (let n = from; n <= to; n++) {
    const hl = sn.hl && sn.hl[n] ? ' hl' : '';
    rows += '<span class="ln' + hl + zoneOf(n) + '" data-ln="' + n + '"><span class="zn"></span><span class="no">' + n + '</span><span class="tx">' + (esc(all[n - 1]) || ' ') + '</span></span>';
  }
  const keys = sn.hl ? Object.keys(sn.hl).map(Number).sort((a, b) => a - b) : [];
  const notes = keys.map(n => '<li tabindex="0" data-ln="' + n + '"><span class="lno">Line ' + n + '</span><span>' + sn.hl[n] + '</span></li>').join('');
  const legend = sn.zones ? '<div class="zone-legend"><span style="--c:var(--zone-fence)">Fence</span><span style="--c:var(--zone-template)">Template</span><span style="--c:var(--zone-style)">Style</span></div>' : '';
  return legend + '<figure class="code"><div class="code-head"><span>' + esc(sn.file) + '</span>' + (sn.lines ? '<span class="lab">lines ' + from + '–' + to + '</span>' : '') + '</div><div class="code-scroll"><div class="code-lines">' + rows + '</div></div>' + (notes ? '<ul class="notes">' + notes + '</ul>' : '') + '</figure>';
}

function renderLesson(host, n){
  const L = LESSONS[n - 1];
  if (!L) { renderHome(host); return; }
  const si = Math.max(0, Math.min(state.step[L.id] || 0, L.steps.length - 1));
  const st = L.steps[si];
  state.seen[L.id] = state.seen[L.id] || {};
  state.seen[L.id][si] = 1;
  const pills = L.steps.map((s, i) =>
    '<button type="button" class="step-pill' + (state.seen[L.id][i] ? ' is-seen' : '') + '" data-step="' + i + '"' + (i === si ? ' aria-current="step"' : '') + '><span class="num">' + (i + 1) + '</span>' + esc(s.label) + '</button>').join('');
  host.innerHTML =
    '<div class="lesson-head"><p class="kicker">Lesson ' + n + ' of ' + LESSONS.length + '</p><h1>' + esc(L.title) + '</h1><p class="goal">' + esc(L.goal) + '</p>' +
    (state.done[L.id] ? '<p class="done-flag" style="margin:-.4rem 0 .8rem">✓ Finished</p>' : '') +
    '<nav class="stepper" aria-label="Lesson steps">' + pills + '</nav></div>' +
    '<section class="step-body">' + stepHTML(L, st) + '</section>' +
    '<div class="step-nav" id="stepNav">' + stepNavHTML(L, n, si) + '</div>';
  mountWidgets(host, L);
  bindNotes(host);
  bindLesson(host, L, n, si);
}
function stepHTML(L, st){
  if (st.type === 'read') return st.html;
  if (st.type === 'code') return '<p class="snippet-intro">' + st.intro + '</p>' + st.snippets.map(renderSnippet).join('') + '<p class="muted small">Hover over or tab to a note to highlight its line.</p>';
  if (st.type === 'try') return (state.ex[L.id] ? '<span class="ex-badge">✓ You’ve completed this exercise</span>' : '') + st.html;
  if (st.type === 'quiz') return '<div class="quiz">' + st.qs.map((q, qi) => quizQ(L, q, qi)).join('') + '</div><p class="quiz-foot muted small" style="margin-top:1.4rem">Change an answer at any time. Answers are saved.</p>';
  return '';
}
function quizQ(L, q, qi){
  const key = L.id + '-' + qi, pick = state.quiz[key];
  const answered = typeof pick === 'number';
  const opts = q.opts.map((o, oi) => {
    let cls = 'opt';
    if (answered) { if (oi === pick) cls += ' is-picked ' + (o.ok ? 'is-right' : 'is-wrong'); if (o.ok) cls += ' is-right-answer'; }
    return '<button type="button" class="' + cls + '" data-q="' + qi + '" data-o="' + oi + '" aria-pressed="' + (oi === pick) + '"><span class="key">' + 'ABCD'[oi] + '</span><span>' + o.t + '</span></button>';
  }).join('');
  let ex = '';
  if (answered) {
    const right = q.opts[pick] && q.opts[pick].ok;
    ex = '<div class="explain"><p class="verdict ' + (right ? 'ok' : 'bad') + '">' + (right ? 'Right.' : 'Not quite.') + '</p><ul>' +
      q.opts.map((o, oi) => '<li><span class="tag ' + (o.ok ? 'ok' : 'bad') + '">' + (o.ok ? '✓' : '✗') + ' ' + 'ABCD'[oi] + '</span>' + o.why + '</li>').join('') + '</ul></div>';
  }
  return '<div class="q-block" data-qblock="' + qi + '"><p class="q-text"><span class="qn">' + (qi + 1) + '.</span>' + q.q + '</p><div class="opts">' + opts + '</div><div aria-live="polite">' + ex + '</div></div>';
}
function quizComplete(L){
  const qz = L.steps.find(s => s.type === 'quiz');
  return qz.qs.every((q, qi) => typeof state.quiz[L.id + '-' + qi] === 'number');
}
function stepNavHTML(L, n, si){
  const last = L.steps.length - 1;
  const back = si > 0
    ? '<button type="button" class="btn secondary" data-nav="prev">Back: ' + esc(L.steps[si - 1].label) + '</button>'
    : (n > 1 ? '<button type="button" class="btn secondary" data-go="lesson-' + (n - 1) + '">Previous lesson</button>' : '<span></span>');
  let fwd;
  if (si < last) fwd = '<button type="button" class="btn" data-nav="next">Next: ' + esc(L.steps[si + 1].label) + '</button>';
  else if (state.done[L.id]) fwd = n < LESSONS.length ? '<button type="button" class="btn" data-go="lesson-' + (n + 1) + '">Next lesson: ' + esc(LESSONS[n].title) + '</button>' : '<button type="button" class="btn" data-go="home">Back to the start page</button>';
  else {
    const ok = quizComplete(L);
    fwd = '<span style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">' + (ok ? '' : '<span class="muted small">Answer all three questions to finish.</span>') + '<button type="button" class="btn" data-nav="finish"' + (ok ? '' : ' disabled') + '>Finish lesson</button></span>';
  }
  return back + fwd;
}
function bindLesson(host, L, n, si){
  const goStep = i => { state.step[L.id] = i; save(); renderLesson(host, n); const head = $('.lesson-head', host); if (head && head.getBoundingClientRect().top < 0) window.scrollTo(0, 0); };
  $$('.step-pill', host).forEach(b => b.addEventListener('click', () => goStep(parseInt(b.dataset.step, 10))));
  const nav = $('#stepNav', host);
  nav.addEventListener('click', e => {
    const b = e.target.closest('[data-nav]'); if (!b) return;
    if (b.dataset.nav === 'prev') goStep(si - 1);
    else if (b.dataset.nav === 'next') goStep(si + 1);
    else if (b.dataset.nav === 'finish') { state.done[L.id] = true; save(); renderLesson(host, n); const f = $('#stepNav .btn:last-child', host); if (f) f.focus(); }
  });
  const quiz = $('.quiz', host);
  if (quiz) quiz.addEventListener('click', e => {
    const b = e.target.closest('.opt'); if (!b) return;
    const qi = parseInt(b.dataset.q, 10), oi = parseInt(b.dataset.o, 10);

    const qz = L.steps.find(s => s.type === 'quiz');
    const blk = $('[data-qblock="' + qi + '"]', quiz);
    blk.outerHTML = quizQ(L, qz.qs[qi], qi);
    const again = $('[data-qblock="' + qi + '"] .opt[data-o="' + oi + '"]', quiz); if (again) again.focus();
    nav.innerHTML = stepNavHTML(L, n, si);
  });
}
function mountWidgets(scope, L){
  $$('[data-widget]', scope).forEach(el => {

  const byId = id => CARDS.find(c => c.id === id);

    if (c.decoy) { decoy = true; msg = 'Right to leave that one out. The mockup isn’t part of the pipeline, so changing it changes nothing on the site.'; kind = 'part'; draw(); return; }

  });
  draw();
};

/* ---- Generic classify ---- */
function classify(el, ctx, set){
  if (!state.cls[set.key]) state.cls[set.key] = {};
  function draw(focus){
    const store = state.cls[set.key] || {};
    const right = set.items.filter(i => store[i.id] === i.ans).length, all = set.items.length;
    el.innerHTML = '<div class="widget"><p class="cls-score" aria-live="polite">' + right + ' of ' + all + ' sorted correctly' + (right === all ? '. All done.' : '.') + '</p><div class="cls-list">' +
      set.items.map(it => {
        const pick = store[it.id];
        const st = pick ? (pick === it.ans ? ' is-right' : ' is-wrong') : '';
        return '<div class="cls-item' + st + '"><div class="what">' + (it.code ? '<pre>' + esc(it.code) + '</pre>' : '') + (it.desc ? '<span class="desc">' + esc(it.desc) + '</span>' : '') + '</div>' +
          '<div class="cls-bins" role="group" aria-label="Where does this belong?">' + set.bins.map(b => {
            const on = pick === b.id;
            return '<button type="button" class="bin-btn' + (on ? (b.id === it.ans ? ' is-right' : ' is-wrong') : '') + '" aria-pressed="' + on + '" data-item="' + it.id + '" data-bin="' + b.id + '">' + esc(b.label) + '</button>';
          }).join('') + '</div>' +
          (pick ? (pick === it.ans ? '<p class="cls-why ok">Right. <span>' + it.why + '</span></p>' : '<p class="cls-why bad">Not quite. <span>' + it.miss + '</span></p>') : '') + '</div>';
      }).join('') + '</div><div class="btn-row"><button type="button" class="btn secondary small" data-act="reset">Clear my answers</button></div></div>';
    if (focus) { const f = $('.bin-btn[data-item="' + focus[0] + '"][data-bin="' + focus[1] + '"]', el); if (f) f.focus({ preventScroll: true }); }
  }
  el.addEventListener('click', e => {
    const b = e.target.closest('.bin-btn');
    if (b) {
      if (!state.cls[set.key]) state.cls[set.key] = {};
      state.cls[set.key][b.dataset.item] = b.dataset.bin; save(); draw([b.dataset.item, b.dataset.bin]);
      const store = state.cls[set.key];
      if (ctx && set.items.every(i => store[i.id] === i.ans)) ctx.done();
      return;
    }
    if (e.target.closest('[data-act="reset"]')) { state.cls[set.key] = {}; save(); draw(); }
  });
  draw();
}

/* ---- Lesson 8: router ---- */
function routeOf(raw){
  let p = String(raw || '').trim().replace(/^\/+/, '').replace(/^src\/pages\//, '');
  if (!p) return { err: 'Type a file name, for example <code>about.astro</code>.' };
  if (/\s/.test(p)) return { err: 'Avoid spaces in file names: they end up in the address. Use hyphens, like <code>contact-us.astro</code>.' };
  const segs = p.split('/').filter(Boolean);
  if (segs.some(s => s.charAt(0) === '_')) return { err: 'Files and folders whose names start with <code>_</code> are skipped: they never become pages.' };
  const last = segs[segs.length - 1];
  let m = last.match(/^(.+)\.(astro|md|html)$/i);
  if (m && !/\.(ts|js)$/i.test(last)) {
    const name = m[1], dirs = segs.slice(0, -1);
    const parts = name === 'index' ? dirs : dirs.concat([name]);
    return { url: '/' + parts.join('/') + (parts.length ? '/' : ''), dist: 'dist/' + (parts.length ? parts.join('/') + '/' : '') + 'index.html',
      note: m[2].toLowerCase() === 'md' ? 'A Markdown page (Lesson 12).' : (m[2].toLowerCase() === 'html' ? 'Astro accepts plain .html pages too, but they can’t use components. Your project uses .astro.' : '') };
  }
  m = last.match(/^(.+\.[a-z0-9]+)\.(ts|js)$/i);
  if (m) { const outp = segs.slice(0, -1).concat([m[1]]).join('/'); return { url: '/' + outp, dist: 'dist/' + outp, note: 'Code that produces this file directly, like your team.html.ts.' }; }
  if (/\.(ts|js)$/i.test(last)) return { err: 'A .ts file here needs the output’s extension in its name, like <code>team.html.ts</code>.' };
  if (/\.(css|jpe?g|png|svg|webp|gif)$/i.test(last)) return { err: 'Images and stylesheets don’t belong in <code>src/pages/</code>. Images go in <code>public/</code>, styles in <code>src/styles/</code>.' };
  if (last.indexOf('.') < 0) return { err: 'Add a file extension. A page needs <code>.astro</code>.' };
  return { err: 'Astro won’t turn this file type into a page. Use <code>.astro</code>.' };
}

const FILE_TO_MAP = { site: 'site', services: 'services', tokens: 'tokens', global: 'global', newpage: 'pages', index: 'index', baselayout: 'baselayout', header: 'header', footer: 'footer', serviceblock: 'serviceblock', photohero: 'photohero', motion: 'motion', public: 'public' };
function judge(sc, pick){
  if (sc.right.indexOf(pick) >= 0) return { k: 'ok', v: 'Right.', t: sc.ok };
  if (sc.part && sc.part[pick]) return { k: 'part', v: 'Close, but not the first file to open.', t: sc.part[pick] };
  if (FILE_GENERIC[pick]) return { k: 'bad', v: 'Not this one.', t: FILE_GENERIC[pick] };
  const opt = FILE_OPTS.find(o => o.id === pick), mp = MAP.find(x => x.id === FILE_TO_MAP[pick]);
  return { k: 'bad', v: 'Not this one.', t: '<code>' + esc(opt.label) + '</code> is for something else. ' + (mp ? mp.what : '') };
}
function renderWhich(host){
  if (wfIndex === null) { const f = SCENARIOS.findIndex(s => !(state.scen[s.id] && state.scen[s.id].solved)); wfIndex = f < 0 ? 0 : f; }
  const sc = SCENARIOS[wfIndex], rec = state.scen[sc.id];
  const groups = []; FILE_OPTS.forEach(o => { if (groups.indexOf(o.group) < 0) groups.push(o.group); });
  const pick = rec && rec.pick;
  const res = pick ? judge(sc, pick) : null;
  const solvedCount = SCENARIOS.filter(s => state.scen[s.id] && state.scen[s.id].solved).length;
  host.innerHTML = '<h1>Which file do I edit?</h1><p class="lede">Real jobs you’ll be asked to do. Pick the file you’d open first.</p><p class="small muted">' + solvedCount + ' of ' + SCENARIOS.length + ' solved.</p>' +
    '<div class="wf"><ul class="scen-list">' + SCENARIOS.map((s, i) => { const ok = state.scen[s.id] && state.scen[s.id].solved; return '<li><button type="button" class="scen-btn' + (ok ? ' is-solved' : '') + '" data-sc="' + i + '" aria-current="' + (i === wfIndex) + '"><span class="mk">' + (ok ? '✓' : (i + 1)) + '</span><span class="txt">' + esc(s.q) + '</span></button></li>'; }).join('') + '</ul>' +
    '<div class="scen-card"><p class="kicker">Job ' + (wfIndex + 1) + ' of ' + SCENARIOS.length + '</p><h2>' + esc(sc.q) + '</h2>' +
    '<div class="file-grid" role="group" aria-label="Files">' + groups.map(g => '<p class="file-group">' + esc(g) + '</p>' + FILE_OPTS.filter(o => o.group === g).map(o => {
      let cls = 'file-btn'; if (pick === o.id && res) cls += res.k === 'ok' ? ' is-right' : (res.k === 'part' ? ' is-part' : ' is-wrong');
      return '<button type="button" class="' + cls + '" data-file="' + o.id + '" aria-pressed="' + (pick === o.id) + '">' + esc(o.label).replace(/\//g, '/<wbr>') + '</button>';
    }).join('')).join('') + '</div>' +
    '<div aria-live="polite">' + (res ? '<div class="feedback ' + res.k + '"><span class="v">' + res.v + '</span>' + res.t + (res.k !== 'ok' ? ' <span class="muted">Try another file.</span>' : '') + '</div>' : '') + '</div>' +
    '<div class="btn-row">' + (wfIndex < SCENARIOS.length - 1 ? '<button type="button" class="btn' + (res && res.k === 'ok' ? '' : ' secondary') + '" data-next="1">Next job</button>' : '<button type="button" class="btn secondary" data-next="0">Back to the first job</button>') + '</div></div></div>';
  host.onclick = e => {
    const s = e.target.closest('[data-sc]'); if (s) { wfIndex = parseInt(s.dataset.sc, 10); renderWhich(host); return; }
    const f = e.target.closest('[data-file]');
    if (f) {
      const r = judge(sc, f.dataset.file);
      const prevSolved = state.scen[sc.id] && state.scen[sc.id].solved;
      state.scen[sc.id] = { pick: f.dataset.file, solved: prevSolved || r.k === 'ok' };
      save(); renderWhich(host);
      const again = $('[data-file="' + f.dataset.file + '"]', host); if (again) again.focus({ preventScroll: true });
      return;
    }
    const n = e.target.closest('[data-next]');
    if (n) { wfIndex = n.dataset.next === '1' ? wfIndex + 1 : 0; renderWhich(host); const h = $('.scen-card h2', host); if (h) h.scrollIntoView({ block: 'nearest' }); }
  };
}

/* =========================================================
   Where does it run? / Glossary
   ========================================================= */
function renderWhere(host){
  host.innerHTML = '<h1>Where does it run?</h1><p class="lede">Sort each piece of your project: does it run during the build on your computer, in the visitor’s browser, or is it not part of the site at all?</p><p class="small">Unsure? Lesson 10 covers this: <button type="button" class="linklike" data-go="lesson-10">Build time vs browser time</button>.</p><div data-o="cls"></div>';
  classify($('[data-o="cls"]', host), null, CLS.sorter);
}
function renderGlossary(host){
  host.innerHTML = '<h1>Glossary</h1><p class="lede">Plain-English definitions, each linked to the lesson that explains it.</p><label class="visually-hidden" for="glossQ">Filter terms</label><input id="glossQ" class="inp gloss-search" type="search" placeholder="Filter terms"><dl class="gloss" id="glossList"></dl>';
  const draw = q => {
    q = (q || '').trim().toLowerCase();
    const items = GLOSSARY.filter(g => !q || g.t.toLowerCase().indexOf(q) >= 0 || g.d.toLowerCase().indexOf(q) >= 0);
    $('#glossList').innerHTML = items.length ? items.map(g => '<div><dt>' + esc(g.t) + '</dt><dd>' + g.d + '<span class="see"><button type="button" class="linklike" data-go="lesson-' + g.l + '">Lesson ' + g.l + ': ' + esc(LESSONS[g.l - 1].title) + '</button></span></dd></div>').join('') : '<p class="muted">No terms match. Try a shorter word.</p>';
  };
  $('#glossQ').addEventListener('input', e => draw(e.target.value));
  draw('');
}

/* =========================================================
   Start
   ========================================================= */
buildNav();
const h0 = (location.hash || '').slice(1);
const start = VIEWS.indexOf(h0) >= 0 ? h0 : (VIEWS.indexOf(state.last) >= 0 ? state.last : 'home');
render(start);
try { history.replaceState(null, '', '#' + start); } catch (e) {}
initRemote();
})();
</script>
</body>
